name: Industry site build

on:
  push:
    paths:
      - "industry/**"
      - ".github/workflows/industry-build.yml"
  pull_request:
    paths:
      - "industry/**"
      - ".github/workflows/industry-build.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: industry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: industry/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
