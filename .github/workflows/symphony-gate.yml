name: Symphony gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: symphony-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: |
            industry-mainpage/package-lock.json
            hrms/package-lock.json
            testcar/package-lock.json
            export-car-demo/package-lock.json
            adpulse/package-lock.json
      - name: Validate Symphony policy
        run: node scripts/validate-symphony-workflow.mjs
      - name: Test all portfolio apps
        run: npm test
      - name: Lint all portfolio apps
        run: npm run lint
