name: HRMS build

on:
  push:
    paths:
      - "hrms/**"
      - ".github/workflows/hrms-build.yml"
  pull_request:
    paths:
      - "hrms/**"
      - ".github/workflows/hrms-build.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hrms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hrms/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test
      - run: npm run build
